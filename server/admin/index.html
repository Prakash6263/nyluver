<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyluver Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F8F6F3;
  --card: #FFFFFF;
  --border: #E8E4DE;
  --green: #1B3A2D;
  --green-light: #2D5A45;
  --gold: #C9A96E;
  --gold-light: #E8D8B8;
  --text: #1B3A2D;
  --text-secondary: #6B7C74;
  --red: #C04040;
  --blue: #3B82F6;
  --amber: #D97706;
  --success: #16A34A;
  --sidebar-w: 240px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display:flex; min-height:100vh; }
.sidebar { width:var(--sidebar-w); background:var(--green); color:#fff; position:fixed; top:0; left:0; bottom:0; overflow-y:auto; z-index:100; }
.sidebar-brand { padding:24px 20px; border-bottom:1px solid rgba(255,255,255,.1); }
.sidebar-brand h1 { font-family:'Playfair Display',serif; font-size:22px; font-weight:600; color:var(--gold); }
.sidebar-brand span { font-size:11px; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:2px; }
.sidebar-nav { padding:12px 0; }
.sidebar-nav a { display:flex; align-items:center; gap:12px; padding:10px 20px; color:rgba(255,255,255,.7); text-decoration:none; font-size:13px; font-weight:500; transition:all .2s; cursor:pointer; }
.sidebar-nav a:hover, .sidebar-nav a.active { background:rgba(255,255,255,.1); color:#fff; }
.sidebar-nav a.active { border-right:3px solid var(--gold); }
.sidebar-nav .section-label { padding:16px 20px 6px; font-size:10px; text-transform:uppercase; letter-spacing:2px; color:rgba(255,255,255,.3); }
.main { margin-left:var(--sidebar-w); flex:1; padding:24px 32px; }
.page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
.page-header h2 { font-family:'Playfair Display',serif; font-size:24px; font-weight:600; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border:none; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; transition:all .2s; }
.btn-primary { background:var(--green); color:#fff; }
.btn-primary:hover { background:var(--green-light); }
.btn-gold { background:var(--gold); color:#fff; }
.btn-gold:hover { background:#B89A60; }
.btn-danger { background:var(--red); color:#fff; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-outline:hover { background:#f5f3f0; }
.btn-sm { padding:5px 10px; font-size:12px; }
.card { background:var(--card); border-radius:12px; border:1px solid var(--border); padding:20px; margin-bottom:16px; }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
.stat-card { background:var(--card); border-radius:12px; border:1px solid var(--border); padding:20px; }
.stat-card .label { font-size:12px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
.stat-card .value { font-family:'Playfair Display',serif; font-size:28px; font-weight:700; color:var(--green); }
.stat-card .sub { font-size:11px; color:var(--text-secondary); margin-top:4px; }
table { width:100%; border-collapse:collapse; }
th { text-align:left; padding:10px 12px; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-secondary); border-bottom:2px solid var(--border); }
td { padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
tr:hover td { background:#FAFAF8; }
.badge { display:inline-block; padding:3px 8px; border-radius:20px; font-size:11px; font-weight:600; }
.badge-green { background:#E6F4EA; color:#16A34A; }
.badge-amber { background:#FEF3CD; color:#D97706; }
.badge-red { background:#FDE8E8; color:#C04040; }
.badge-blue { background:#DBEAFE; color:#3B82F6; }
.badge-gray { background:#F3F4F6; color:#6B7C74; }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:12px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
.form-group input, .form-group textarea, .form-group select { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:'Inter',sans-serif; background:#fff; color:var(--text); }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,169,110,.15); }
.form-group textarea { min-height:80px; resize:vertical; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
.modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:1000; }
.modal { background:#fff; border-radius:16px; padding:24px; width:90%; max-width:600px; max-height:85vh; overflow-y:auto; }
.modal h3 { font-family:'Playfair Display',serif; font-size:20px; margin-bottom:16px; }
.modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
.login-container { display:flex; align-items:center; justify-content:center; min-height:100vh; width:100%; }
.login-card { background:#fff; border-radius:16px; padding:40px; width:360px; text-align:center; border:1px solid var(--border); }
.login-card h1 { font-family:'Playfair Display',serif; color:var(--green); margin-bottom:6px; }
.login-card .subtitle { color:var(--text-secondary); font-size:13px; margin-bottom:24px; }
.tabs { display:flex; gap:4px; margin-bottom:16px; background:var(--bg); border-radius:10px; padding:4px; }
.tab { flex:1; padding:8px; text-align:center; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; transition:all .2s; color:var(--text-secondary); }
.tab.active { background:#fff; color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.1); }
.search-bar { display:flex; gap:8px; margin-bottom:16px; }
.search-bar input { flex:1; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:13px; }
.search-bar input:focus { outline:none; border-color:var(--gold); }
.empty-state { text-align:center; padding:40px; color:var(--text-secondary); }
.empty-state p { font-size:14px; }
.toggle { width:40px; height:22px; border-radius:11px; background:#ccc; position:relative; cursor:pointer; transition:background .3s; }
.toggle.active { background:var(--success); }
.toggle::after { content:''; position:absolute; width:18px; height:18px; border-radius:50%; background:#fff; top:2px; left:2px; transition:left .3s; }
.toggle.active::after { left:20px; }
.tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; background:var(--gold-light); color:var(--green); margin:2px; }
.img-thumb { width:48px; height:48px; border-radius:8px; object-fit:cover; }
.status-select { padding:4px 8px; border:1px solid var(--border); border-radius:6px; font-size:12px; background:#fff; }
.loading { text-align:center; padding:40px; color:var(--text-secondary); }
.flex-between { display:flex; justify-content:space-between; align-items:center; }
.hidden { display:none !important; }
.chip-list { display:flex; flex-wrap:wrap; gap:6px; }
.chip { padding:4px 10px; border-radius:20px; font-size:12px; border:1px solid var(--border); cursor:pointer; transition:all .2s; }
.chip.selected { background:var(--green); color:#fff; border-color:var(--green); }
@media(max-width:768px) { .sidebar { display:none; } .main { margin-left:0; padding:16px; } .form-row,.form-row-3 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = window.location.pathname.startsWith('/nyluver/') ? '/nyluver' : '';
let currentUser = null;
let currentPage = 'dashboard';
let pageData = {};

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    credentials: 'include',
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: 'Request failed' }));
    throw new Error(err.error || 'Request failed');
  }
  return res.json();
}

async function checkAuth() {
  try {
    const { user } = await api('/api/auth/me');
    if (user && user.role === 'admin') { currentUser = user; renderApp(); }
    else { renderLogin(); }
  } catch { renderLogin(); }
}

function renderLogin() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="login-container">
      <div class="login-card">
        <h1>Nyluver</h1>
        <p class="subtitle">Admin Dashboard</p>
        <div id="login-form">
          <div class="form-group">
            <label>Admin Phone</label>
            <input id="login-phone" placeholder="+218910000000" value="+218910000000">
          </div>
          <button class="btn btn-primary" style="width:100%" onclick="sendAdminOtp()">Send OTP</button>
        </div>
        <div id="otp-form" class="hidden">
          <div class="form-group">
            <label>Enter OTP Code</label>
            <input id="login-otp" placeholder="123456" maxlength="6">
          </div>
          <p id="dev-otp" style="font-size:11px;color:var(--text-secondary);margin-bottom:12px;"></p>
          <button class="btn btn-primary" style="width:100%" onclick="verifyAdminOtp()">Login</button>
        </div>
        <p id="login-error" style="color:var(--red);font-size:12px;margin-top:12px;"></p>
      </div>
    </div>`;
}

async function sendAdminOtp() {
  const phone = document.getElementById('login-phone').value;
  try {
    const res = await api('/api/auth/send-otp', { method: 'POST', body: { phone } });
    document.getElementById('login-form').classList.add('hidden');
    document.getElementById('otp-form').classList.remove('hidden');
    if (res.devCode) document.getElementById('dev-otp').textContent = 'Dev code: ' + res.devCode;
  } catch (e) { document.getElementById('login-error').textContent = e.message; }
}

async function verifyAdminOtp() {
  const phone = document.getElementById('login-phone').value;
  const code = document.getElementById('login-otp').value;
  try {
    const res = await api('/api/auth/admin-login', { method: 'POST', body: { phone, code } });
    currentUser = res.user;
    renderApp();
  } catch (e) { document.getElementById('login-error').textContent = e.message; }
}

function renderApp() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="sidebar">
      <div class="sidebar-brand"><h1>Nyluver</h1><span>Admin Panel</span></div>
      <nav class="sidebar-nav">
        <a onclick="nav('dashboard')" data-page="dashboard">&#9632; Dashboard</a>
        <div class="section-label">Catalog</div>
        <a onclick="nav('products')" data-page="products">&#9827; Products</a>
        <a onclick="nav('categories')" data-page="categories">&#9733; Categories</a>
        <a onclick="nav('occasions')" data-page="occasions">&#10047; Occasions</a>
        <a onclick="nav('moods')" data-page="moods">&#9830; Moods</a>
        <a onclick="nav('addons')" data-page="addons">&#10010; Add-Ons</a>
        <div class="section-label">Operations</div>
        <a onclick="nav('orders')" data-page="orders">&#9993; Orders</a>
        <a onclick="nav('drivers')" data-page="drivers">&#9951; Drivers</a>
        <a onclick="nav('slots')" data-page="slots">&#9201; Slots</a>
        <div class="section-label">Marketing</div>
        <a onclick="nav('promos')" data-page="promos">&#9889; Promo Codes</a>
        <a onclick="nav('banners')" data-page="banners">&#9634; Banners</a>
        <a onclick="nav('loyalty')" data-page="loyalty">&#9813; Loyalty</a>
        <a onclick="nav('subscriptions')" data-page="subscriptions">&#8634; Subscriptions</a>
        <div class="section-label">System</div>
        <a onclick="nav('whatsapp')" data-page="whatsapp">&#9742; WhatsApp</a>
        <a onclick="nav('fraud')" data-page="fraud">&#9888; Fraud</a>
        <a onclick="nav('users')" data-page="users">&#9823; Users</a>
        <a onclick="nav('cities')" data-page="cities">&#9960; Cities</a>
      </nav>
    </div>
    <div class="main" id="page-content"></div>`;
  nav('dashboard');
}

function nav(page) {
  currentPage = page;
  document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.toggle('active', a.dataset.page === page));
  loadPage(page);
}

async function loadPage(page) {
  const el = document.getElementById('page-content');
  el.innerHTML = '<div class="loading">Loading...</div>';
  try {
    switch(page) {
      case 'dashboard': await renderDashboard(el); break;
      case 'products': await renderProducts(el); break;
      case 'categories': await renderCategories(el); break;
      case 'occasions': await renderOccasions(el); break;
      case 'moods': await renderMoods(el); break;
      case 'addons': await renderAddOns(el); break;
      case 'orders': await renderOrders(el); break;
      case 'drivers': await renderDrivers(el); break;
      case 'slots': await renderSlots(el); break;
      case 'promos': await renderPromos(el); break;
      case 'banners': await renderBanners(el); break;
      case 'loyalty': await renderLoyalty(el); break;
      case 'subscriptions': await renderSubscriptions(el); break;
      case 'whatsapp': await renderWhatsApp(el); break;
      case 'fraud': await renderFraud(el); break;
      case 'users': await renderUsers(el); break;
      case 'cities': await renderCities(el); break;
    }
  } catch(e) { el.innerHTML = `<div class="card"><p style="color:var(--red)">${e.message}</p></div>`; }
}

// ═══════ DASHBOARD ═══════
async function renderDashboard(el) {
  const d = await api('/api/admin/dashboard');
  const statusMap = {};
  (d.statusBreakdown || []).forEach(s => statusMap[s.status] = s.count);
  el.innerHTML = `
    <div class="page-header"><h2>Dashboard</h2><span style="color:var(--text-secondary);font-size:13px">Welcome back, ${currentUser.nameEn || 'Admin'}</span></div>
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Total Orders</div><div class="value">${d.totalOrders}</div></div>
      <div class="stat-card"><div class="label">Products</div><div class="value">${d.totalProducts}</div></div>
      <div class="stat-card"><div class="label">Customers</div><div class="value">${d.totalUsers}</div></div>
      <div class="stat-card"><div class="label">Today's Revenue</div><div class="value">${d.todayRevenue.toFixed(2)} <small style="font-size:14px">LYD</small></div></div>
    </div>
    <div class="card">
      <h3 style="font-family:'Playfair Display',serif;margin-bottom:12px">Orders by Status</h3>
      <div style="display:flex;flex-wrap:wrap;gap:12px">
        ${['pending_payment','paid','awaiting_recipient','accepted','in_prep','ready','out_for_delivery','delivered','failed_delivery','cancelled'].map(s =>
          `<div style="padding:8px 16px;border-radius:8px;border:1px solid var(--border);font-size:13px"><span style="font-weight:600">${statusMap[s]||0}</span> <span style="color:var(--text-secondary)">${s.replace(/_/g,' ')}</span></div>`
        ).join('')}
      </div>
    </div>`;
}

// ═══════ PRODUCTS ═══════
async function renderProducts(el) {
  const products = await api('/api/admin/products');
  const cats = await api('/api/admin/categories');
  const catMap = {};
  cats.forEach(c => catMap[c.id] = c.nameEn);
  el.innerHTML = `
    <div class="page-header"><h2>Products</h2><button class="btn btn-primary" onclick="showProductModal()">+ Add Product</button></div>
    <div class="card" style="overflow-x:auto">
      <table>
        <thead><tr><th>Product</th><th>Category</th><th>Price (LYD)</th><th>Price (USD)</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${products.map(p => `
          <tr>
            <td><strong>${p.nameEn}</strong><br><small style="color:var(--text-secondary)">${p.nameAr}</small></td>
            <td>${catMap[p.categoryId] || '-'}</td>
            <td>${p.priceLYD}</td>
            <td>$${p.priceUSD}</td>
            <td>${p.stockCount}</td>
            <td>${p.isActive ? '<span class="badge badge-green">Active</span>' : '<span class="badge badge-gray">Inactive</span>'}
                ${p.isFeatured ? '<span class="badge badge-amber">Featured</span>' : ''}
                ${p.isPopular ? '<span class="badge badge-blue">Popular</span>' : ''}</td>
            <td><button class="btn btn-outline btn-sm" onclick="editProduct('${p.id}')">Edit</button></td>
          </tr>`).join('')}</tbody>
      </table>
      ${products.length === 0 ? '<div class="empty-state"><p>No products yet</p></div>' : ''}
    </div>`;
}

async function showProductModal(id) {
  let product = { nameEn:'', nameAr:'', descriptionEn:'', descriptionAr:'', priceLYD:'0', priceUSD:'0', categoryId:'', stockCount:0, isFeatured:false, isPopular:false, expressEligible:false, isActive:true };
  if (id) {
    product = await api('/api/products/' + id);
  }
  const cats = await api('/api/admin/categories');
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.onclick = e => { if(e.target===modal) modal.remove(); };
  modal.innerHTML = `
    <div class="modal">
      <h3>${id ? 'Edit' : 'Add'} Product</h3>
      <div class="form-row">
        <div class="form-group"><label>Name (EN)</label><input id="mp-nameEn" value="${product.nameEn||''}"></div>
        <div class="form-group"><label>Name (AR)</label><input id="mp-nameAr" value="${product.nameAr||''}" dir="rtl"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Description (EN)</label><textarea id="mp-descEn">${product.descriptionEn||''}</textarea></div>
        <div class="form-group"><label>Description (AR)</label><textarea id="mp-descAr" dir="rtl">${product.descriptionAr||''}</textarea></div>
      </div>
      <div class="form-row-3">
        <div class="form-group"><label>Price LYD</label><input id="mp-priceLYD" type="number" value="${product.priceLYD}"></div>
        <div class="form-group"><label>Price USD</label><input id="mp-priceUSD" type="number" value="${product.priceUSD}"></div>
        <div class="form-group"><label>Category</label><select id="mp-cat">${cats.map(c=>`<option value="${c.id}" ${c.id===product.categoryId?'selected':''}>${c.nameEn}</option>`).join('')}</select></div>
      </div>
      <div class="form-row-3">
        <div class="form-group"><label>Stock Count</label><input id="mp-stock" type="number" value="${product.stockCount||0}"></div>
        <div class="form-group"><label>Featured</label><select id="mp-feat"><option value="false" ${!product.isFeatured?'selected':''}>No</option><option value="true" ${product.isFeatured?'selected':''}>Yes</option></select></div>
        <div class="form-group"><label>Popular</label><select id="mp-pop"><option value="false" ${!product.isPopular?'selected':''}>No</option><option value="true" ${product.isPopular?'selected':''}>Yes</option></select></div>
      </div>
      <div class="form-group"><label>Image URLs (one per line)</label><textarea id="mp-imgs">${(product.images||[]).map(i=>i.url||i).join('\n')}</textarea></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
        <button class="btn btn-primary" onclick="saveProduct('${id||''}')">Save</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

async function saveProduct(id) {
  const data = {
    nameEn: document.getElementById('mp-nameEn').value,
    nameAr: document.getElementById('mp-nameAr').value,
    descriptionEn: document.getElementById('mp-descEn').value,
    descriptionAr: document.getElementById('mp-descAr').value,
    priceLYD: document.getElementById('mp-priceLYD').value,
    priceUSD: document.getElementById('mp-priceUSD').value,
    categoryId: document.getElementById('mp-cat').value,
    stockCount: parseInt(document.getElementById('mp-stock').value),
    isFeatured: document.getElementById('mp-feat').value === 'true',
    isPopular: document.getElementById('mp-pop').value === 'true',
    images: document.getElementById('mp-imgs').value.split('\n').map(u=>u.trim()).filter(Boolean),
  };
  if (id) await api('/api/admin/products/' + id, { method:'PUT', body:data });
  else await api('/api/admin/products', { method:'POST', body:data });
  document.querySelector('.modal-overlay')?.remove();
  nav('products');
}
window.editProduct = id => showProductModal(id);

// ═══════ CATEGORIES ═══════
async function renderCategories(el) {
  const cats = await api('/api/admin/categories');
  el.innerHTML = `
    <div class="page-header"><h2>Categories</h2><button class="btn btn-primary" onclick="showCategoryModal()">+ Add Category</button></div>
    <div class="card"><table>
      <thead><tr><th>Name (EN)</th><th>Name (AR)</th><th>Slug</th><th>Sort</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${cats.map(c=>`<tr>
        <td>${c.nameEn}</td><td>${c.nameAr}</td><td><code>${c.slug}</code></td><td>${c.sortOrder}</td>
        <td>${c.isActive?'<span class="badge badge-green">Active</span>':'<span class="badge badge-gray">Inactive</span>'}</td>
        <td><button class="btn btn-outline btn-sm" onclick="showCategoryModal('${c.id}','${c.nameEn}','${c.nameAr}','${c.slug}',${c.sortOrder},${c.isActive})">Edit</button></td>
      </tr>`).join('')}</tbody>
    </table></div>`;
}

function showCategoryModal(id,nameEn='',nameAr='',slug='',sort=0,active=true) {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.onclick = e => { if(e.target===modal) modal.remove(); };
  modal.innerHTML = `<div class="modal"><h3>${id?'Edit':'Add'} Category</h3>
    <div class="form-row"><div class="form-group"><label>Name EN</label><input id="mc-en" value="${nameEn}"></div><div class="form-group"><label>Name AR</label><input id="mc-ar" value="${nameAr}" dir="rtl"></div></div>
    <div class="form-row"><div class="form-group"><label>Slug</label><input id="mc-slug" value="${slug}"></div><div class="form-group"><label>Sort Order</label><input id="mc-sort" type="number" value="${sort}"></div></div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button><button class="btn btn-primary" onclick="saveCategory('${id||''}')">Save</button></div></div>`;
  document.body.appendChild(modal);

function filterOrders(status) {

  const status = document.getElementById('od-status').value;
  const notes = document.getElementById('od-notes').value;

  await api('/api/admin/orders/'+id+'/status', {method:'PUT', body:{status,notes}});

  document.querySelector('.modal-overlay')?.remove();
  nav('orders');
}

async function sendWA(phone, message, orderId, btn) {
  if (!phone) { alert('No phone number available'); return; }
  const origText = btn.innerHTML;
  btn.innerHTML = '⏳ Sending...';
  btn.disabled = true;
  try {
    const result = await api('/api/admin/whatsapp/send', {method:'POST', body:{phone, message, orderId}});
    if (result.success) {
      btn.innerHTML = '✅ Sent!';
      btn.style.background = '#4CAF50';
      btn.style.color = '#fff';
      setTimeout(() => { btn.innerHTML = origText; btn.disabled = false; btn.style.background = ''; btn.style.color = ''; }, 3000);
    } else {
      throw new Error('Send failed');
    }
  } catch(e) {
    btn.innerHTML = '❌ Failed';
    btn.style.background = '#f44336';
    btn.style.color = '#fff';
    setTimeout(() => { btn.innerHTML = origText; btn.disabled = false; btn.style.background = ''; btn.style.color = ''; }, 3000);
  }
}

async function logWhatsApp(orderId) {
  await api('/api/admin/whatsapp-log', {method:'POST', body:{
    orderId, templateUsed:document.getElementById('od-wa-tpl').value||'Manual',
    outcome:document.getElementById('od-wa-out').value, notes:document.getElementById('od-wa-notes').value, language:'en'
  }});
  showOrderDetail(orderId);
}

// ═══════ FRAUD ═══════
async function renderFraud(el) {
  const flags = await api('/api/admin/fraud');
  el.innerHTML = `<div class="page-header"><h2>Fraud Detection</h2></div>
    <div class="tabs"><div class="tab active" onclick="filterFraud(this,'all')">All</div><div class="tab" onclick="filterFraud(this,'unresolved')">Unresolved</div><div class="tab" onclick="filterFraud(this,'resolved')">Resolved</div></div>
    <div class="card"><table><thead><tr><th>Date</th><th>Reason</th><th>Order</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="fraud-tbody">${flags.map(f=>`<tr data-resolved="${f.resolved}">
      <td>${new Date(f.createdAt).toLocaleDateString()}</td><td>${f.reason}</td><td>${f.orderId||'-'}</td>
      <td>${f.resolved?'<span class="badge badge-green">Resolved</span>':'<span class="badge badge-red">Open</span>'}</td>
      <td>${!f.resolved?`<button class="btn btn-outline btn-sm" onclick="resolveFraud('${f.id}')">Resolve</button>`:''}</td>
    </tr>`).join('')}</tbody></table>
    ${flags.length===0?'<div class="empty-state"><p>No fraud flags</p></div>':''}</div>`;
}

function filterFraud(tab,filter) {
  document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  document.querySelectorAll('#fraud-tbody tr').forEach(tr=>{
    if(filter==='all') tr.style.display='';
    else if(filter==='resolved') tr.style.display=tr.dataset.resolved==='true'?'':'none';
    else tr.style.display=tr.dataset.resolved==='false'?'':'none';
  });
}

async function resolveFraud(id) {
  await api('/api/admin/fraud/'+id+'/resolve',{method:'PUT'});
  nav('fraud');
}
