<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyluver Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F8F6F3;
  --card: #FFFFFF;
  --border: #E8E4DE;
  --green: #1B3A2D;
  --green-light: #2D5A45;
  --gold: #C9A96E;
  --gold-light: #E8D8B8;
  --text: #1B3A2D;
  --text-secondary: #6B7C74;
  --red: #C04040;
  --blue: #3B82F6;
  --amber: #D97706;
  --success: #16A34A;
  --sidebar-w: 240px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display:flex; min-height:100vh; }
.sidebar { width:var(--sidebar-w); background:var(--green); color:#fff; position:fixed; top:0; left:0; bottom:0; overflow-y:auto; z-index:100; display:flex; flex-direction:column; justify-content:space-between; }
.sidebar-brand { padding:24px 20px; border-bottom:1px solid rgba(255,255,255,.1); }
.sidebar-brand h1 { font-family:'Playfair Display',serif; font-size:22px; font-weight:600; color:var(--gold); }
.sidebar-brand span { font-size:11px; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:2px; }
.sidebar-nav { padding:12px 0; flex:1; }
.sidebar-nav a { display:flex; align-items:center; gap:12px; padding:10px 20px; color:rgba(255,255,255,.7); text-decoration:none; font-size:13px; font-weight:500; transition:all .2s; cursor:pointer; }
.sidebar-nav a:hover, .sidebar-nav a.active { background:rgba(255,255,255,.1); color:#fff; }
.sidebar-nav a.active { border-right:3px solid var(--gold); }
.sidebar-nav .section-label { padding:16px 20px 6px; font-size:10px; text-transform:uppercase; letter-spacing:2px; color:rgba(255,255,255,.3); }
.sidebar-footer { padding:16px 20px; border-top:1px solid rgba(255,255,255,.1); background:rgba(0,0,0,.15); }
.main { margin-left:var(--sidebar-w); flex:1; padding:24px 32px; transition:all .2s; }
.top-header { display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 20px; margin-bottom:24px; box-shadow:0 1px 3px rgba(0,0,0,.03); }
.top-header-title h2 { font-family:'Playfair Display',serif; font-size:20px; font-weight:600; color:var(--green); margin:0; }
.top-header-title p { font-size:12px; color:var(--text-secondary); margin:2px 0 0 0; }
.page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
.page-header h2 { font-family:'Playfair Display',serif; font-size:24px; font-weight:600; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border:none; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; transition:all .2s; }
.btn-primary { background:var(--green); color:#fff; }
.btn-primary:hover { background:var(--green-light); }
.btn-gold { background:var(--gold); color:#fff; }
.btn-gold:hover { background:#B89A60; }
.btn-danger { background:var(--red); color:#fff; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-outline:hover { background:#f5f3f0; }
.btn-sm { padding:5px 10px; font-size:12px; }
.card { background:var(--card); border-radius:12px; border:1px solid var(--border); padding:20px; margin-bottom:16px; }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
.stat-card { background:var(--card); border-radius:12px; border:1px solid var(--border); padding:20px; }
.stat-card .label { font-size:12px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
.stat-card .value { font-family:'Playfair Display',serif; font-size:28px; font-weight:700; color:var(--green); }
.stat-card .sub { font-size:11px; color:var(--text-secondary); margin-top:4px; }
table { width:100%; border-collapse:collapse; }
th { text-align:left; padding:10px 12px; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-secondary); border-bottom:2px solid var(--border); }
td { padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
tr:hover td { background:#FAFAF8; }
.badge { display:inline-block; padding:3px 8px; border-radius:20px; font-size:11px; font-weight:600; }
.badge-green { background:#E6F4EA; color:#16A34A; }
.badge-amber { background:#FEF3CD; color:#D97706; }
.badge-red { background:#FDE8E8; color:#C04040; }
.badge-blue { background:#DBEAFE; color:#3B82F6; }
.badge-gray { background:#F3F4F6; color:#6B7C74; }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:12px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
.form-group input, .form-group textarea, .form-group select { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; font-family:'Inter',sans-serif; background:#fff; color:var(--text); }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,169,110,.15); }
.form-group textarea { min-height:80px; resize:vertical; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
.modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:1000; }
.modal { background:#fff; border-radius:16px; padding:24px; width:90%; max-width:600px; max-height:85vh; overflow-y:auto; }
.modal h3 { font-family:'Playfair Display',serif; font-size:20px; margin-bottom:16px; }
.modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
.login-container { display:flex; align-items:center; justify-content:center; min-height:100vh; width:100%; }
.login-card { background:#fff; border-radius:16px; padding:40px; width:380px; text-align:center; border:1px solid var(--border); box-shadow:0 4px 12px rgba(0,0,0,.05); }
.login-card h1 { font-family:'Playfair Display',serif; color:var(--green); margin-bottom:6px; }
.login-card .subtitle { color:var(--text-secondary); font-size:13px; margin-bottom:20px; }
.tabs { display:flex; gap:4px; margin-bottom:16px; background:var(--bg); border-radius:10px; padding:4px; }
.tab { flex:1; padding:8px; text-align:center; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; transition:all .2s; color:var(--text-secondary); }
.tab.active { background:#fff; color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.1); }
.search-bar { display:flex; gap:8px; margin-bottom:16px; }
.search-bar input { flex:1; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:13px; }
.search-bar input:focus { outline:none; border-color:var(--gold); }
.empty-state { text-align:center; padding:40px; color:var(--text-secondary); }
.empty-state p { font-size:14px; }
.toggle { width:40px; height:22px; border-radius:11px; background:#ccc; position:relative; cursor:pointer; transition:background .3s; }
.toggle.active { background:var(--success); }
.toggle::after { content:''; position:absolute; width:18px; height:18px; border-radius:50%; background:#fff; top:2px; left:2px; transition:left .3s; }
.toggle.active::after { left:20px; }
.tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; background:var(--gold-light); color:var(--green); margin:2px; }
.img-thumb { width:48px; height:48px; border-radius:8px; object-fit:cover; }
.status-select { padding:4px 8px; border:1px solid var(--border); border-radius:6px; font-size:12px; background:#fff; }
.loading { text-align:center; padding:40px; color:var(--text-secondary); }
.flex-between { display:flex; justify-content:space-between; align-items:center; }
.hidden { display:none !important; }
.chip-list { display:flex; flex-wrap:wrap; gap:6px; }
.chip { padding:4px 10px; border-radius:20px; font-size:12px; border:1px solid var(--border); cursor:pointer; transition:all .2s; }
.chip.selected { background:var(--green); color:#fff; border-color:var(--green); }
#app { flex:1; min-width:0; }

/* ── Mobile navigation (phone / tablet) ─────────────────── */
.mobile-bar { display:none; }
.nav-toggle { display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--green); font-size:18px; line-height:1; cursor:pointer; }
.nav-backdrop { display:none; }

@media(max-width:900px) {
  .mobile-bar {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    position:sticky; top:0; z-index:200; background:var(--green); padding:10px 14px;
  }
  .mobile-bar .mobile-brand { font-family:'Playfair Display',serif; font-size:18px; color:var(--gold); }
  .mobile-bar .nav-toggle { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.22); color:#fff; }
  .mobile-bar .lang-switch { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.15); }
  .mobile-bar .lang-switch .lang-btn { color:rgba(255,255,255,.7); }
  .mobile-bar .lang-switch .lang-btn.active { background:var(--gold); color:var(--green); }
  .sidebar {
    display:flex; width:min(78vw,280px); z-index:300;
    transform:translateX(-100%); transition:transform .25s ease;
    box-shadow:0 0 24px rgba(0,0,0,.35);
  }
  body.nav-open .sidebar { transform:translateX(0); }
  html[dir="rtl"] .sidebar { transform:translateX(100%); }
  html[dir="rtl"] body.nav-open .sidebar { transform:translateX(0); }
  .nav-backdrop { display:block; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:250; opacity:0; pointer-events:none; transition:opacity .2s; }
  body.nav-open .nav-backdrop { opacity:1; pointer-events:auto; }
  .main { margin-left:0; margin-right:0; padding:14px; }
  .form-row,.form-row-3 { grid-template-columns:1fr; }
  .top-header { display:none; }
  .page-header { flex-wrap:wrap; gap:10px; }
  .page-header h2 { font-size:20px; }
  .top-header { flex-wrap:wrap; gap:10px; }
  .card { padding:14px; overflow-x:auto; }
  table { min-width:540px; }
  .modal { width:94%; padding:18px; }
  .stats-grid { grid-template-columns:1fr 1fr; gap:10px; }
  .stat-card { padding:14px; }
  .stat-card .value { font-size:22px; }
  .login-container { min-height:calc(100vh - 62px); padding:24px 14px; }
  .login-card { width:100%; max-width:400px; padding:28px 22px; }
}
@media(max-width:420px) { .stats-grid { grid-template-columns:1fr; } }

/* ── Language switcher (EN / AR) ───────────────────────── */
.lang-switch { display:inline-flex; align-items:center; gap:3px; background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:3px 6px; }
.lang-switch .lang-btn { background:transparent; border:0; color:var(--text-secondary); font-size:12px; font-weight:500; font-family:inherit; padding:4px 10px; border-radius:14px; cursor:pointer; transition:all .2s; }
.lang-switch .lang-btn:hover { color:var(--text); }
.lang-switch .lang-btn.active { background:var(--green); color:#fff; font-weight:600; }
.sidebar-footer .lang-switch { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.15); width:100%; justify-content:center; }
.sidebar-footer .lang-switch .lang-btn { color:rgba(255,255,255,.7); width:50%; text-align:center; }
.sidebar-footer .lang-switch .lang-btn.active { background:var(--gold); color:var(--green); }
.login-card .lang-switch { background:var(--bg); border-color:var(--border); display:inline-flex; margin-bottom:20px; }

/* ── Arabic (RTL) ──────────────────────────────────────── */
html[dir="rtl"] body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; }
html[dir="rtl"] .sidebar { left:auto; right:0; }
html[dir="rtl"] .main { margin-left:0; margin-right:var(--sidebar-w); }
html[dir="rtl"] .sidebar-nav a.active { border-right:0; border-left:3px solid var(--gold); }
html[dir="rtl"] th, html[dir="rtl"] td { text-align:right; }
html[dir="rtl"] .modal-actions { justify-content:flex-start; }
html[dir="rtl"] .toggle::after { left:auto; right:2px; }
html[dir="rtl"] .toggle.active::after { left:auto; right:20px; }
html[dir="rtl"] .sidebar-brand h1,
html[dir="rtl"] .top-header-title h2,
html[dir="rtl"] .page-header h2,
html[dir="rtl"] .modal h3,
html[dir="rtl"] .login-card h1,
html[dir="rtl"] .stat-card .value { font-family: 'Cairo', serif; }
html[dir="rtl"] .form-group input, 
html[dir="rtl"] .form-group textarea, 
html[dir="rtl"] .form-group select { font-family: 'Cairo', sans-serif; }
@media(max-width:768px) { html[dir="rtl"] .main { margin-right:0; } }
</style>

// Get multilingual value from object based on active LANG
function getLangField(obj, fieldName = 'name') {
  if (!obj) return '';
  if (LANG === 'ar') {
    return obj[fieldName + 'Ar'] || obj[fieldName + 'En'] || obj[fieldName] || '';
  }
  return obj[fieldName + 'En'] || obj[fieldName + 'Ar'] || obj[fieldName] || '';
}

// Render primary language with secondary language subtext
function renderBilingualText(obj, mainField = 'name') {
  if (!obj) return '';
  const primary = getLangField(obj, mainField);
  const secondaryField = LANG === 'ar' ? mainField + 'En' : mainField + 'Ar';
  const secondary = obj[secondaryField];
  if (secondary && secondary !== primary) {
    return `<strong>${primary}</strong><br><small style="color:var(--text-secondary)">${secondary}</small>`;
  }
  return `<strong>${primary}</strong>`;
}

// Translate a single UI string (identity when language is English)
function t(key) {
  if (LANG !== 'ar' || key === undefined || key === null) return key;
  const str = String(key).trim();
  if (AR[str]) return AR[str];
  const formatted = str.replace(/_/g, ' ');
  if (AR[formatted]) return AR[formatted];
  return key;
}

// Translate text node in DOM, preserving any icon/symbol prefix or suffix
function translateText(text) {
  if (LANG !== 'ar' || typeof text !== 'string' || !text) return text;
  if (AR[text]) return AR[text];
  const m = text.match(/^([^a-zA-Z0-9\u0600-\u06FF]*)([\s\S]*?)([^a-zA-Z0-9\u0600-\u06FF]*)$/);
  if (!m) return text;
  const prefix = m[1];
  const core = m[2].trim();
  const suffix = m[3];
  if (AR[core]) {
    return prefix + AR[core] + suffix;
  }
  return text;
}

// Walk a subtree and translate its text nodes + placeholders in place.
function translateDom(root) {
  if (LANG !== 'ar' || !root || !root.nodeType) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      const parent = node.parentNode;
      if (!parent || parent.nodeType !== 1) return NodeFilter.FILTER_REJECT;
      const tag = parent.nodeName;
      if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'TEXTAREA') return NodeFilter.FILTER_REJECT;
      if (parent.closest && parent.closest('[data-no-translate]')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const next = translateText(node.nodeValue);
    if (next !== node.nodeValue) node.nodeValue = next;
  });
  const els = [];
  if (root.nodeType === 1 && root.hasAttribute && root.hasAttribute('placeholder')) els.push(root);
  if (root.querySelectorAll) root.querySelectorAll('[placeholder]').forEach(el => els.push(el));
  els.forEach(el => {
    const value = el.getAttribute('placeholder');
    const next = translateText(value);
    if (next !== value) el.setAttribute('placeholder', next);
  });
}

let translateQueued = false;
function queueTranslate() {
  if (LANG !== 'ar' || translateQueued) return;
  translateQueued = true;
  requestAnimationFrame(() => {
    translateQueued = false;
    try { translateDom(document.body); } catch (e) {}
  });
}

// Every page renders its markup as an HTML string, so translations are applied
// as soon as that markup lands in the DOM.
function observeTranslations() {
  const observer = new MutationObserver(mutations => {
    if (LANG !== 'ar') return;
    for (const mutation of mutations) {
      if (mutation.type === 'childList') { queueTranslate(); return; }
      if (mutation.type === 'attributes' && mutation.attributeName === 'placeholder') {
        const el = mutation.target;
        const value = el.getAttribute('placeholder');
        const next = translateText(value);
        if (next !== value) el.setAttribute('placeholder', next);
      }
    }
  });
  observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['placeholder'] });
}

function applyLangAttrs() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
}

function langSwitcherHtml() {
  return '<div class="lang-switch" data-no-translate>'
    + '<button type="button" class="lang-btn' + (LANG === 'en' ? ' active' : '') + '" onclick="setLang(\'en\')">English</button>'
    + '<button type="button" class="lang-btn' + (LANG === 'ar' ? ' active' : '') + '" onclick="setLang(\'ar\')">العربية</button>'
    + '</div>';
}

function setLang(lang) {
  if (lang !== 'en' && lang !== 'ar') return;
  LANG = lang;
  try {
    localStorage.setItem(LANG_KEY, lang);
  } catch (e) {}
  applyLangAttrs();
  if (!currentUser) { renderLogin(); return; }
  const page = currentPage;
  renderApp();
  if (page && page !== 'dashboard') nav(page);
}

function showToast(message, icon = 'success') {
  Swal.fire({ toast: true, position: LANG === 'ar' ? 'top-start' : 'top-end', icon, title: t(message), showConfirmButton: false, timer: 2500, timerProgressBar: true, dir: LANG === 'ar' ? 'rtl' : 'ltr' });
}

async function confirmDialog(title, text, confirmButtonText = 'Yes') {
  const result = await Swal.fire({ title: t(title), text: t(text), icon: 'warning', showCancelButton: true, confirmButtonColor: '#C04040', cancelButtonColor: '#6B7C74', confirmButtonText: t(confirmButtonText), cancelButtonText: t('Cancel'), dir: LANG === 'ar' ? 'rtl' : 'ltr' });
  return result.isConfirmed;
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
    credentials: 'include',
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: 'Request failed' }));
    throw new Error(err.error || 'Request failed');
  }
  return res.json();
}

async function sendWA(phone, message, orderId, btn) {
  if (!phone) { showToast('No phone number available', 'warning'); return; }
  const origText = btn.innerHTML;
  btn.innerHTML = '⏳ Sending...';
  btn.disabled = true;
  try {
    const result = await api('/api/admin/whatsapp/send', {method:'POST', body:{phone, message, orderId}});
    if (result.success) {
      btn.innerHTML = '✅ Sent!';
      btn.style.background = '#4CAF50';
      btn.style.color = '#fff';
      setTimeout(() => { btn.innerHTML = origText; btn.disabled = false; btn.style.background = ''; btn.style.color = ''; }, 3000);
    } else {
      throw new Error('Send failed');
    }
  } catch(e) {
    btn.innerHTML = '❌ Failed';
    btn.style.background = '#f44336';
    btn.style.color = '#fff';
    setTimeout(() => { btn.innerHTML = origText; btn.disabled = false; btn.style.background = ''; btn.style.color = ''; }, 3000);
  }
}

async function logWhatsApp(orderId) {
  await api('/api/admin/whatsapp-log', {method:'POST', body:{
    orderId, templateUsed:'Manual',
    outcome:document.getElementById('od-wa-out').value, notes:document.getElementById('od-wa-notes').value, language:'en'
  }});
  showOrderDetail(orderId);
}

async function loadSlots() {
  const cityId = document.getElementById('slot-city').value;

  const slots = await api(`/api/admin/slots/${cityId}/${date}`);
  document.getElementById('slots-container').innerHTML = `<table><thead><tr><th>Time</th><th>Capacity</th><th>Used</th><th>Available</th><th>Actions</th></tr></thead>

async function updateSlot(id) {
  const cap = document.querySelector(`input[data-id="${id}"]`).value;

async function loadBlackouts() {

  const bds = await api('/api/admin/blackout-dates/'+cityId);
  document.getElementById('blackout-list').innerHTML = bds.map(b=>`<div style="display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid var(--border)"><span>${b.date} - ${b.reason||'No reason'}</span><button class="btn btn-danger btn-sm" onclick="removeBlackout('${b.id}')">Remove</button></div>`).join('') || '<p style="color:var(--text-secondary);font-size:13px">No blackout dates</p>';

async function addBlackout() {
  const cityId = document.getElementById('slot-city').value;
  await api('/api/admin/blackout-dates', {method:'POST', body:{cityId,date:document.getElementById('bo-date').value,reason:document.getElementById('bo-reason').value}});

}

async function removeBlackout(id) {
  await api('/api/admin/blackout-dates/'+id, {method:'DELETE'});

}

  el.innerHTML = `<div class="page-header"><h2>Fraud Detection</h2></div>
    <div class="tabs"><div class="tab active" onclick="filterFraud(this,'all')">All</div><div class="tab" onclick="filterFraud(this,'unresolved')">Unresolved</div><div class="tab" onclick="filterFraud(this,'resolved')">Resolved</div></div>
    <div class="card"><table><thead><tr><th>Date</th><th>Reason</th><th>Order</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="fraud-tbody">${flags.map(f=>`<tr data-resolved="${f.resolved}">
      <td>${new Date(f.createdAt).toLocaleDateString()}</td><td>${f.reason}</td><td>${f.orderId||'-'}</td>
      <td>${f.resolved?'<span class="badge badge-green">Resolved</span>':'<span class="badge badge-red">Open</span>'}</td>
      <td>${!f.resolved?`<button class="btn btn-outline btn-sm" onclick="resolveFraud('${f.id}')">Resolve</button>`:''}</td>
    </tr>`).join('')}</tbody></table>
    ${flags.length===0?'<div class="empty-state"><p>No fraud flags</p></div>':''}</div>`;
}

function filterFraud(tab,filter) {
  document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  document.querySelectorAll('#fraud-tbody tr').forEach(tr=>{
    if(filter==='all') tr.style.display='';
    else if(filter==='resolved') tr.style.display=tr.dataset.resolved==='true'?'':'none';
    else tr.style.display=tr.dataset.resolved==='false'?'':'none';
  });
}

async function resolveFraud(id) {
  await api('/api/admin/fraud/'+id+'/resolve',{method:'PUT'});
  nav('fraud');
}

// ═══════ USERS ═══════
async function renderUsers(el) {
  const users = await api('/api/admin/users');
  el.innerHTML = `<div class="page-header"><h2>Users</h2></div>
    <div class="card" style="overflow-x:auto"><table><thead><tr><th>Phone</th><th>Name</th><th>Role</th><th>Points</th><th>Blacklisted</th><th>Joined</th><th>Actions</th></tr></thead>
    <tbody>${users.map(u=>`<tr>
      <td>${u.phone}</td><td>${getLangField(u, 'name') || '-'}</td>
      <td><span class="badge badge-${u.role==='admin'?'amber':'blue'}">${t(u.role)}</span></td>
      <td>${u.loyaltyPoints}</td>
      <td>${u.isBlacklisted?'<span class="badge badge-red">Yes</span>':'-'}</td>
      <td>${new Date(u.createdAt).toLocaleDateString()}</td>
      <td>${!u.isBlacklisted&&u.role!=='admin'?`<button class="btn btn-danger btn-sm" onclick="blacklistUser('${u.id}')">Blacklist</button>`:''}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

async function blacklistUser(id) {
  const ok = await confirmDialog('Blacklist user?', 'This user will be blocked from the app.');
  if (!ok) return;
  try {
    await api('/api/admin/users/'+id+'/blacklist',{method:'POST'});
    showToast('User blacklisted');
    nav('users');
  } catch (e) {
    Swal.fire({ icon: 'error', title: 'Error', text: e.message });
  }
}

// ═══════ CITIES ═══════
async function renderCities(el) {
  const cities = await api('/api/admin/cities');
  el.innerHTML = `<div class="page-header"><h2>Cities</h2><button class="btn btn-primary" onclick="showCityModal()">+ Add City</button></div>
    <div class="card"><table><thead><tr><th>Name EN</th><th>Name AR</th><th>Currency</th><th>VAT</th><th>Mode</th><th>Actions</th></tr></thead>
    <tbody>${cities.map(c=>`<tr><td>${c.nameEn}</td><td>${c.nameAr}</td><td>${c.currency}</td>
      <td>${c.vatEnabled?c.vatPercent+'%':'Off'}</td><td>${c.inventoryMode}</td>
      <td><button class="btn btn-outline btn-sm" onclick='showCityModal(${JSON.stringify(c)})'>Edit</button></td></tr>`).join('')}</tbody></table></div>`;
}

function showCityModal(c) {
  c = c || {nameEn:'',nameAr:'',country:'Libya',currency:'LYD',vatEnabled:false,vatPercent:'0',fxRateToUSD:'0.2',inventoryMode:'stock'};
  const modal = document.createElement('div');
  modal.className='modal-overlay';
  modal.onclick=e=>{if(e.target===modal)modal.remove();};
  modal.innerHTML=`<div class="modal"><h3>${c.id?'Edit':'Add'} City</h3>
    <div class="form-row"><div class="form-group"><label>Name EN</label><input id="mci-en" value="${c.nameEn}"></div><div class="form-group"><label>Name AR</label><input id="mci-ar" value="${c.nameAr}" dir="rtl"></div></div>
    <div class="form-row-3"><div class="form-group"><label>Currency</label><input id="mci-cur" value="${c.currency}"></div><div class="form-group"><label>VAT %</label><input id="mci-vat" type="number" value="${c.vatPercent}"></div><div class="form-group"><label>FX to USD</label><input id="mci-fx" type="number" step="0.0001" value="${c.fxRateToUSD}"></div></div>
    <div class="form-row"><div class="form-group"><label>VAT Enabled</label><select id="mci-ve"><option value="false" ${!c.vatEnabled?'selected':''}>No</option><option value="true" ${c.vatEnabled?'selected':''}>Yes</option></select></div><div class="form-group"><label>Inventory Mode</label><select id="mci-im"><option value="stock" ${c.inventoryMode==='stock'?'selected':''}>Stock</option><option value="quota" ${c.inventoryMode==='quota'?'selected':''}>Quota</option></select></div></div>
    <div class="modal-actions"><button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button><button class="btn btn-primary" onclick="saveCity('${c.id||''}')">Save</button></div></div>`;
  document.body.appendChild(modal);
}

async function saveCity(id) {
  const data={nameEn:document.getElementById('mci-en').value,nameAr:document.getElementById('mci-ar').value,currency:document.getElementById('mci-cur').value,vatPercent:document.getElementById('mci-vat').value,fxRateToUSD:document.getElementById('mci-fx').value,vatEnabled:document.getElementById('mci-ve').value==='true',inventoryMode:document.getElementById('mci-im').value};
  if(id) await api('/api/admin/cities/'+id,{method:'PUT',body:data});
  else await api('/api/admin/cities',{method:'POST',body:data});
  document.querySelector('.modal-overlay')?.remove();
  nav('cities');
}

// ═══════ INIT ═══════
applyLangAttrs();
observeTranslations();
checkAuth();
</script>
</body>
