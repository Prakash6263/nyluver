name: Deploy Nyluver Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Server
        run: npm run server:build

      - name: Deploy Build to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          source: "server_dist/*,package.json,package-lock.json,server/admin/index.html,server/templates/"
          target: "~/nyluver-backend"

      - name: Install Dependencies and Restart Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          script: |
            cd ~/nyluver-backend
            npm install --omit=dev

            # Write .env file on server with all required variables
            cat > .env << EOF
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            PORT=4020
            NODE_ENV=production
            EXPO_PUBLIC_DOMAIN=node.aitechnotech.in
            DEFAULT_OTP=123456
            EOF

            # Sync database schema (drizzle push)
            npx drizzle-kit push

            # Ensure PM2 is installed
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            # Restart or start the backend
            if pm2 list | grep -q "nyluver-backend"; then
              pm2 delete nyluver-backend
            fi
            pm2 start server_dist/index.js --name "nyluver-backend" --node-args="--env-file=.env"

            # Save PM2 process list so it survives server reboots
            pm2 save
