name: Deploy Nyluver Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline || npm ci

      - name: Build Server
        run: npm run server:build

      - name: Deploy Build to Server (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "server_dist/,package.json,package-lock.json,ecosystem.config.cjs,server/admin/index.html,server/templates/,scripts/check-smtp.mjs"
          target: "~/nyluver-backend"
          strip_components: 0

      - name: Install Dependencies and Restart Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            cd ~/nyluver-backend
            npm install --omit=dev

            # Write core .env vars (preserve any extra vars like WHATSAPP credentials)
            # Only set vars if they are not already present in .env
            touch .env
            grep -q "^DATABASE_URL=" .env    || echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"    >> .env
            grep -q "^SESSION_SECRET=" .env  || echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env
            grep -q "^PORT=" .env            || echo "PORT=4020"                                    >> .env
            grep -q "^NODE_ENV=" .env        || echo "NODE_ENV=production"                          >> .env
            grep -q "^DEFAULT_OTP=" .env     || echo "DEFAULT_OTP=123456"                           >> .env
            grep -q "^SMTP_HOST=" .env       || echo "SMTP_HOST=smtp.gmail.com"                     >> .env
            grep -q "^SMTP_PORT=" .env       || echo "SMTP_PORT=587"                                >> .env
            grep -q "^SMTP_SECURE=" .env     || echo "SMTP_SECURE=false"                            >> .env
            grep -q "^SMTP_USER=" .env       || echo "SMTP_USER=${{ secrets.SMTP_USER }}"           >> .env
            grep -q "^SMTP_PASS=" .env       || echo "SMTP_PASS=${{ secrets.SMTP_PASS }}"           >> .env
            grep -q "^EMAIL_FROM=" .env      || echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}"         >> .env

            # Update vars that must be in sync with GitHub secrets
            sed -i "s|^DATABASE_URL=.*|DATABASE_URL=${{ secrets.DATABASE_URL }}|" .env
            sed -i "s|^SESSION_SECRET=.*|SESSION_SECRET=${{ secrets.SESSION_SECRET }}|" .env
            sed -i "s|^SMTP_USER=.*|SMTP_USER=${{ secrets.SMTP_USER }}|" .env
            sed -i "s|^SMTP_PASS=.*|SMTP_PASS=${{ secrets.SMTP_PASS }}|" .env
            sed -i "s|^EMAIL_FROM=.*|EMAIL_FROM=${{ secrets.EMAIL_FROM }}|" .env

            # Verification codes reach users by email only. Warn loudly (without
            # blocking the deploy) when SMTP is missing or cannot authenticate,
            # otherwise the failure stays invisible and codes silently never send.
            if grep -q "^SMTP_PASS=." .env; then
              node --env-file=.env scripts/check-smtp.mjs || \
                echo "WARNING: SMTP check failed - verification codes will NOT be emailed"
            else
              echo "WARNING: SMTP_PASS missing from .env - verification codes will NOT be emailed"
            fi

            # Sync database schema
            npx drizzle-kit push || true

            # Ensure PM2 is installed
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            # Restart existing PM2 process (preserves env vars from .env file)
            # If no process exists, start fresh via ecosystem config
            pm2 restart nyluver-backend --update-env 2>/dev/null || \
              pm2 start ecosystem.config.cjs

            # Save PM2 so it survives reboots
            pm2 save
            echo "✅ Deploy complete!"
